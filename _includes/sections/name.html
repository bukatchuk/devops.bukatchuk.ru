{%- assign d = site.data.name -%}
<section class="cta">
  <div class="wrap">
    <span class="blk rv" style="background:var(--ink)">{{ d.blk }}</span>
    <h2 class="rv nowrap-title">{{ d.title }}</h2>
    <p class="rv">{{ d.text }}</p>
    <div class="btns rv" style="justify-content:center"><a class="btn" href="{{ d.button.href }}">{{ d.button.text }}</a></div>
  </div>
</section>
