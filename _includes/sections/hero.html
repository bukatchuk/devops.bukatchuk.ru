{%- assign d = site.data.hero -%}
<section class="hero">
  <div class="hero__grid" aria-hidden="true"></div>
  <div class="hero__in">
    <span class="blk">{{ d.blk }}</span>
    <div class="eyebrow">{{ d.eyebrow }}</div>
    <span class="blk blk--safety" style="margin-top:.6rem">{{ d.blk_title }}</span>
    <h1>{{ d.title_html }}</h1>
    <p class="hero__sub">{{ d.lead }}</p>
    <div class="btns">
      {%- for b in d.buttons %}
      <a class="btn {% if b.primary %}btn--primary{% else %}btn--ghost{% endif %}" href="{{ b.href }}">{{ b.text }}</a>
      {%- endfor %}
    </div>
  </div>
  <span class="hero__corner hero__corner--l">{{ d.corner_left }}</span>
  <span class="hero__corner hero__corner--r">{{ d.corner_right }}</span>
</section>
