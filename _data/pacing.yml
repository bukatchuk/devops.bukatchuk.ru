# Раздел «pacing»
blk: "Что будет происходить"
title_html: "Год по шагам"
lead: "Пять точек, по которым видно, что вы двигаетесь. Каждая проверяется не ощущением, а тем, что у вас работает."
steps:
  - step: "01"
    when: "Через неделю"
    title: "Три стенда и сервис на них"
    text: "Не прочитано про стенды — собрано и работает. Локальный, VPS и облако, на всех трёх один и тот же сервис."
    tags:
      - text: "Терминал"
        style: ""
      - text: "Стенды"
        style: "filled"
      - text: "Первый результат"
        style: ""
  - step: "02"
    when: "Через месяц"
    title: "Командная строка перестаёт пугать"
    text: "Процессы, права, systemd, логи. Вы перестаёте гуглить одно и то же в третий раз — потому что понимаете, что происходит."
    tags:
      - text: "Linux"
        style: ""
      - text: "systemd"
        style: ""
      - text: "Логи"
        style: "filled"
  - step: "03"
    when: "Через три месяца"
    title: "Сеть читается от кадра до HTTPS"
    text: "Вы локализуете сетевую проблему вместо угадывания. Это тот навык, который отличает инженера от человека с сертификатом."
    tags:
      - text: "TCP/IP"
        style: ""
      - text: "DNS"
        style: ""
      - text: "TLS"
        style: "safety"
  - step: "04"
    when: "Через полгода"
    title: "Приложение, контейнер, пайплайн"
    text: "Разворачиваете приложение с базой, кэшем и очередью, собираете контейнер и выкатываете его пайплайном. Вопрос «почему под не поднимается» перестаёт быть страшным."
    tags:
      - text: "PostgreSQL"
        style: ""
      - text: "Redis"
        style: ""
      - text: "CI/CD"
        style: "filled"
  - step: "05"
    when: "Через год"
    title: "Инженер, которого не приходится доучивать"
    text: "Итоговый проект, портфолио, резюме и понимание всей цепочки от коммита до продакшена."
    tags:
      - text: "Проект"
        style: "safety"
      - text: "Резюме"
        style: ""
      - text: "Собеседование"
        style: ""
