# Раздел «payment»
blk: "Как заплатить"
title_html: "Три способа"
lead: "Вопрос на этом месте обычно не «сколько», а «как это провести»."
cards:
  - title: "Картой, помесячно"
    text: "Подписка списывается раз в месяц, отменить можно в любой момент из личного кабинета. Первый месяц возвращается по одному сообщению."
    highlight: false
  - title: "Одним платежом"
    text: "Если выбираете «доступ навсегда» — 50 000 ₽, это цена десяти месяцев. Возврат в течение четырнадцати дней."
    highlight: false
  - title: "Счётом на компанию"
    text: "Для командного тарифа: договор, акт, обмен через ЭДО с квалифицированной электронной подписью. Плюс письмо-обоснование для руководителя, чтобы разговор был служебной задачей, а не личной просьбой."
    highlight: true
