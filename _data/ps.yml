# Раздел «ps»
rows:
  - label: "P.S."
    text: "Если вы дочитали досюда, дело не в мотивации и не в дисциплине. Дело в том, что список своих пробелов вы не можете составить сами: для этого нужно знать то, чего вы не знаете. Порядок, где база идёт до инструментов, решает ровно эту задачу — и он уже собран, вам не нужно его угадывать."
  - label: "P.P.S."
    text: "Первый месяц возвращается по одному сообщению. Это значит, что решение стоит вам не шестидесяти тысяч и не года, а одного вечера: открыть маршрут первой недели и посмотреть, двигается ли дело. Если не двигается — напишите, верну, и никаких объяснений не потребуется."
  - label: "P.P.P.S."
    text: "И честно про то, чего здесь нет. Нет наставника, который будет вести вас за руку, нет потока с дедлайнами и нет обещания трудоустройства. Есть порядок, практика на трёх стендах и проверки после каждого блока. Если вам нужно, чтобы кто-то тянул, — это другой продукт и другие деньги."
