# Раздел «urgency»
blk: "Срочность и дефицит"
title_html: "Про срок —<br>честно"
lead: "Здесь методичка предлагает дефицит мест и закрытие продаж. У нас ни того, ни другого нет, и придумывать я не стану."
cards:
  - title: "Мест не бывает"
    text: "Это материалы: тираж ничем не ограничен. Строки «осталось 5 мест» здесь не будет."
    highlight: false
  - title: "Настоящий срок один"
    text: "5 000 ₽ — вводная цена. Она держится, пока у курса не появятся первые выпускники с результатом."
    highlight: true
  - title: "Что это значит для вас"
    text: "Это не повод торопиться, а ответ на вопрос, что именно вы покупаете сегодня и почему за столько."
    highlight: false
cut:
  label: "Отсечение"
  html: "<p><strong>Кому этот курс не подойдёт.</strong> Если вы ещё не работали в ИТ — он не для вас: здесь предполагается, что вы умеете работать в терминале и понимаете, что такое сервис.</p>"
