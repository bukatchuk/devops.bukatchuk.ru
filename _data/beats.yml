# Раздел «beats»
blk: "Точка А"
title_html: "Шесть реплик,<br>которые вы себе уже говорили"
lead: "Ни одна не придумана: так формулируют сами инженеры, которые перешли в эксплуатацию из смежной роли."
items:
  - q: "На собеседовании спросили, почему под не поднимается, — и ответить нечем, хотя в резюме написано «Kubernetes»?"
    a: "Спрашивают не про инструмент. Спрашивают про то, что под ним, — и по формулировке вопроса это обычно видно заранее."
  - q: "Взяли на работу, а через месяц выяснилось, что базу вы не понимаете, и спрашивать теперь неудобно?"
    a: "Вас взяли как человека, который это знает. Дальше приходится поддерживать фасад — и это отнимает больше сил, чем сама учёба."
  - q: "Учите то, что попалось в ленте: вчера сети, сегодня Ansible, послезавтра вышла статья про eBPF?"
    a: "Ни одна тема не закрыта до конца, и непонятно, какая из них вообще ваша. Порядок важнее объёма."
  - q: "Садились учиться уже несколько раз и бросали на втором месяце?"
    a: "Результата ещё не видно, а вечера уже кончились. Это не про дисциплину — это про то, где стоит первый результат."
  - q: "На проде всё работает, пока не сломается, — и тогда вы гуглите текст ошибки?"
    a: "Поиск по симптому работает ровно до того момента, пока симптом кому-то уже встречался. Дальше нужна механика."
  - q: "Не знаете, готовы ли вы к дежурству и к следующему грейду — сравнить себя не с чем?"
    a: "Критерии существуют, просто их никто не проговаривает. Они есть в курсе после каждого блока."
