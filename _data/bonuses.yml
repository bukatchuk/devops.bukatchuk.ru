# Раздел «bonuses»
blk: "Бонусы"
title_html: "Что идёт<br>вместе с подпиской"
lead: "Всё, кроме последнего пункта, не требует моего личного времени — поэтому входит в подписку и не влияет на цену."
items:
  - id: "Бонус 1"
    title_html: "Маршрут<br>«первая неделя»"
    text: "Главная причина, по которой обучение бросают, — первый результат стоит слишком далеко. Здесь он стоит на седьмом дне."
    bullets:
      - "что сделать в каждый из семи вечеров"
      - "три стенда: локальный, VPS и облако"
      - "рабочий сервис на всех трёх и снапшоты, чтобы ломать без страха"
      - "рассчитано на четыре часа в неделю, а не на отпуск"
    result: "через неделю у вас собранное рабочее место инженера и результат, который видно своими глазами."
    anchor: "Собрать на рынке: 15 000 ₽ — онбординг-воркшоп"
  - id: "Бонус 2"
    title_html: "«Радар технологий<br>квартала»"
    text: "Раз в квартал — короткий разбор того, что действительно входит в вакансии и в инциденты, а что живёт только в лентах и на конференциях."
    bullets:
      - "по каждой позиции пометка: платят за это или только обсуждают"
      - "что чинит целый класс проблем, а что косметика"
      - "собирается по требованиям вакансий и по задачам заказчиков"
      - "четыре выпуска в год, входит в подписку"
    result: "выбор, чему учиться в этом квартале, занимает десять минут вместо вечера в лентах."
    anchor: "Собрать на рынке: 12 000 ₽ — обзор у внешнего эксперта"
    variant: "dark"
  - id: "Бонус 3"
    title_html: "Критерии готовности<br>по блокам"
    text: "Самое неприятное в самостоятельном обучении — непонятно, закрыта тема или только кажется закрытой. Здесь после каждого блока стоит проверка."
    bullets:
      - "что вы теперь умеете — наблюдаемыми признаками, а не оценкой"
      - "какие вопросы с собеседований этот блок закрывает"
      - "по чему понять, что можно идти дальше"
      - "двадцать блоков — двадцать проверок"
    result: "вы перестаёте гадать, достаточно ли знаете, и говорите о грейде фактами."
    anchor: "Собрать на рынке: 10 000 ₽ — одно mock-интервью"
  - id: "Бонус 4"
    title_html: "Фиксация цены<br>навсегда"
    text: "Цена сегодня вводная, и она вырастет — но только для тех, кто придёт после первых результатов."
    bullets:
      - "пока подписка активна, ваша цена не меняется"
      - "отменили и вернулись в течение трёх месяцев — цена та же"
      - "обязательство письменное, а не обещание на словах"
    result: "вы не платите за то, что пришли раньше остальных, — наоборот."
    anchor: "Стоимость для нас: невозможность поднять вам цену"
    variant: "safety"
  - id: "Бонус 5"
    title_html: "Скидка на разбор<br>проекта и репетицию"
    text: "Единственное, что требует моего личного времени, поэтому оно платное. Но для подписчиков дешевле."
    bullets:
      - "разбор итогового проекта по критериям приёмки"
      - "репетиция собеседования с разбором ответа про инцидент"
      - "письменно плюс сессия — не «понравилось», а что развалится под нагрузкой"
    result: "внешняя проверка — то единственное, чего нельзя получить самостоятельным прохождением."
    anchor: "Отдельно: 15 000 – 25 000 ₽, подписчикам дешевле"
  - id: "Бонус 6"
    title_html: "Готовые файлы<br>ко всем лабораторным"
    text: "Практика ломается не на сложности, а на опечатке в конфиге, который вы перенабирали с картинки."
    bullets:
      - "рабочие файлы, которые запускаются, а не листинги в тексте"
      - "к каждому — что должно получиться и как проверить"
      - "можно сравнить свой результат с эталонным"
    result: "время уходит на понимание, а не на поиск пропущенной скобки."
    anchor: "Входит в подписку"
    variant: "dark"
