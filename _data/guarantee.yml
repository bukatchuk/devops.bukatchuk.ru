# Раздел «guarantee»
blk: "Гарантии"
title_html: "Вы рискуете<br>одним месяцем"
lead: "Не годом обучения, не сотней тысяч и не обещанием, которое проверится через полгода."
cards:
  - title: "Первый месяц — возврат по сообщению"
    text: "Не подошло — написали, вернул. Объяснять и доказывать ничего не нужно."
    highlight: false
  - title: "Вернулись за три месяца — цена та же"
    text: "Отменили из-за аврала или отпуска, вернулись — платите столько же, сколько платили. Прогресс никуда не девается."
    highlight: false
  - title: "Программа открыта до оплаты"
    text: "Двадцать блоков и 197 уроков с названиями видно заранее: вы решаете глазами, а не по обещанию."
    highlight: false
