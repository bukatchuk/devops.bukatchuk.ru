# Раздел «reason»
blk: "Почему сейчас дешевле"
title_html: "Скидок у меня нет.<br>Есть причина низкой цены"
lead: "Если это так ценно, почему продаётся дёшево — законный вопрос. Вот честный ответ, а не приём."
cards:
  - title: "Вводная цена"
    text: "У курса пока нет ни одного выпускника. Первые подписчики нужны мне не меньше, чем я им: по их результатам курс будет продаваться дальше."
    highlight: true
  - title: "Когда она вырастет"
    text: "Когда появятся первые результаты, цена поднимется — но только для тех, кто придёт после."
    highlight: false
  - title: "Ваша не изменится никогда"
    text: "Подписавшись по вводной цене, вы платите её столько, сколько остаётесь подписчиком."
    highlight: false
