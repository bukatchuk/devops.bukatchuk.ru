# Раздел «program»
blk: "Описание продукта"
title_html: "22 блока,<br>216 уроков"
lead: "Каждый урок — 30 минут теории, 30 минут управляемой практики и домашняя работа на час-два. Примеры к лабораторным приходят готовыми файлами, а не листингами в тексте. <a href=\"/program/\">Полное оглавление</a> — все уроки с названиями."
cards:
  - n: "BLK 01—07"
    title_html: "База: 68 уроков<br>до первого контейнера"
    text: "Профессия и рабочее место, Linux, Git, Bash, сети от кадра до HTTPS, Python для эксплуатации, приложения и данные — PostgreSQL, Redis, очереди, бэкапы."
