  - n: "BLK 08—12"
    title_html: "Контейнеры<br>и автоматизация"
    text: "Docker, CI/CD, Ansible, облако и Yandex Cloud, инфраструктура как код на Terraform."
    tags:
      - text: "Docker"
        style: ""
      - text: "CI/CD"
        style: "filled"
      - text: "Terraform"
        style: ""
  - n: "BLK 13—15"
    title_html: "Kubernetes"
    text: "Основы, эксплуатация и управляемый кластер в облаке: Helm, RBAC, сетевые политики, автомасштабирование, GitOps, восстановление кластера."
    variant: "safety"
    stat: "3&nbsp;<small>блока</small>"
  - n: "BLK 16—18"
    title_html: "Надёжность<br>и безопасность"
    text: "Наблюдаемость, практики SRE, безопасность и DevSecOps."
    tags:
      - text: "Метрики"
        style: ""
      - text: "SLO"
        style: ""
      - text: "DevSecOps"
        style: "safety"
  - n: "BLK 19—22"
    title_html: "Выход<br>на работу"
    text: "Платформенная инженерия, экономика и процессы, AI в эксплуатации, итоговый проект, портфолио и подготовка к собеседованию."
    tags:
      - text: "Проект"
        style: ""
      - text: "Портфолио"
        style: ""
      - text: "Собеседование"
        style: "filled"
  - n: "ENV ×3"
    title_html: "Практика в трёх средах"
    text: "Локальный стенд, VPS или bare-metal, Yandex Cloud. Локальный вариант бесплатный — это ответ на «мне негде практиковаться, кроме рабочего прода»."
    wide: true
    tags:
      - text: "Локально"
        style: "filled"
      - text: "VPS / bare-metal"
        style: ""
      - text: "Yandex Cloud"
        style: "safety"
terminal:
  title: "почему порядок именно такой"
  paragraphs:
    - "<span class=\"c\">$</span> <span class=\"g\">explain</span> --order"
    - "<b>Иллюзия понимания.</b> Тема кажется закрытой, потому что вы её однажды настроили — по инструкции, где кто-то другой уже принял все решения. В голове осталась последовательность действий, а не механика. Разница видна в двух местах: на собеседовании, где спрашивают <span class=\"a\">«почему не поднялось»</span>, и на аварии, где инструкция кончилась."
    - "<span class=\"c\"># отсюда правило курса:</span> до первого контейнера идут <b>68 уроков базы</b>. Это единственный способ, при котором контейнер перестаёт быть чёрным ящиком."
